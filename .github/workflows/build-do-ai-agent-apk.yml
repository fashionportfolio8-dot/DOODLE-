name: Build DO AI Agent Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ai-agent-android
    paths:
      - "ai-agent-android/**"
      - ".github/workflows/build-do-ai-agent-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'

      - name: Install web dependencies and build
        working-directory: ai-agent-android
        run: |
          npm install
          npm run build

      - name: Add Android platform and sync
        working-directory: ai-agent-android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: ai-agent-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: do-ai-agent-debug-apk
          path: ai-agent-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
