name: Build Doodle Outpost Game APK

on:
  push:
    branches: [game-android-apk]
    paths:
      - 'game-android-apk/**'
      - 'docs/**'
      - '.github/workflows/build-doodle-outpost-game-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game and Android wrapper
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install wrapper dependencies
        working-directory: game-android-apk
        run: npm install
      - name: Copy game files and add Android platform
        working-directory: game-android-apk
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Force landscape orientation
        working-directory: game-android-apk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:exported="true"', 'android:exported="true" android:screenOrientation="landscape"', 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: game-android-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload game APK
        uses: actions/upload-artifact@v4
        with:
          name: doodle-outpost-game-debug-apk
          path: game-android-apk/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
