name: Build Doodle Outpost Game APK

on:
  push:
    branches: [game-android-apk]
    paths:
      - 'game-android-apk/**'
      - 'docs/**'
      - '.github/workflows/build-doodle-outpost-game-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game and Android wrapper
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install wrapper dependencies
        working-directory: game-android-apk
        run: npm install
      - name: Copy game files and add Android platform
        working-directory: game-android-apk
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Apply full-screen landscape and Doodle Outpost launcher icon
        working-directory: game-android-apk
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import re

          root = Path("android/app/src/main")
          manifest = root / "AndroidManifest.xml"
          source = Path("www/assets/logo.png")
          text = manifest.read_text()
          text = re.sub(
              r'android:exported="true"',
              'android:exported="true" android:screenOrientation="landscape"',
              text,
              count=1
          )
          manifest.write_text(text)

          # Hide Android system bars so the game uses the full landscape display.
          java = root / "java/com/doodleoutpost/game/MainActivity.java"
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text("""package com.doodleoutpost.game;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideSystemUI();
            }
            private void hideSystemUI() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                getWindow().setDecorFitsSystemWindows(false);
                WindowInsetsController c = getWindow().getInsetsController();
                if (c != null) {
                  c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                  c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                }
              } else {
                getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                  View.SYSTEM_UI_FLAG_FULLSCREEN |
                  View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                  View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                  View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                );
              }
            }
            @Override public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideSystemUI();
            }
          }
          """)

          # Reuse the game's own logo for Android launcher icons at every density.
          logo = Image.open(source).convert("RGBA")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
            folder = root / f"res/mipmap-{density}"
            folder.mkdir(parents=True, exist_ok=True)
            canvas = Image.new("RGBA", (size, size), (11, 20, 32, 255))
            contained = ImageOps.contain(logo, (int(size*.78), int(size*.78)), Image.Resampling.LANCZOS)
            canvas.alpha_composite(contained, ((size-contained.width)//2, (size-contained.height)//2))
            canvas.save(folder / "ic_launcher.png")
            canvas.save(folder / "ic_launcher_round.png")

          # Android 8+ uses adaptive icons; point those at the same game logo.
          drawable = root / "res/drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          big = Image.new("RGBA", (432, 432), (11, 20, 32, 255))
          mark = ImageOps.contain(logo, (336, 336), Image.Resampling.LANCZOS)
          big.alpha_composite(mark, ((432-mark.width)//2, (432-mark.height)//2))
          big.save(drawable / "doodle_launcher.png")
          adaptive = root / "res/mipmap-anydpi-v26"
          if adaptive.exists():
            for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              icon_xml = adaptive / name
              if icon_xml.exists():
                icon_xml.write_text(chr(10).join([
                  '<?xml version="1.0" encoding="utf-8"?>',
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">',
                  '  <background android:drawable="@color/ic_launcher_background"/>',
                  '  <foreground android:drawable="@drawable/doodle_launcher"/>',
                  '</adaptive-icon>',
                  ''
                ]))
          print("Applied immersive landscape mode and the Doodle Outpost logo.")
          PY
      - name: Build debug APK
        working-directory: game-android-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload game APK
        uses: actions/upload-artifact@v4
        with:
          name: doodle-outpost-game-debug-apk
          path: game-android-apk/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
