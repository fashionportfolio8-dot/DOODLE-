<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doodle Outpost</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div id="rot">ROTATE YOUR PHONE TO LANDSCAPE</div>

<section id="home" class="scr">
  <div class="top"><h2>DOODLE OUTPOST</h2><div class="row"><button class="btn" id="snd">SOUND: ON</button><button class="btn" id="mus">MUSIC: ON</button></div></div>
  <div class="row" style="flex:1;align-items:stretch">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px">
      <input id="pname" placeholder="YOUR NAME" maxlength="16" style="width:100%;letter-spacing:1px;text-transform:none" value="Commander">
      <div id="lvl" class="mu"></div>
      <button class="btn lime big" onclick="go('modes')">PLAY</button>
      <div class="row"><button class="btn" style="flex:1" onclick="go('join')">JOIN WITH CODE</button><button class="btn" style="flex:1" onclick="go('loadout')">SOLDIERS &amp; WEAPONS</button><button class="btn" style="flex:1" onclick="go('maps')">MAPS</button></div>
    </div>
    <div class="panel" style="flex:1;display:flex;align-items:center;justify-content:center;background:#0008"><img id="hImg" style="max-height:100%;max-width:100%"></div>
  </div>
</section>

<section id="modes" class="scr">
  <div class="top"><button class="btn" onclick="go('home')">← BACK</button><h2>GAME MODE SELECT</h2><span></span></div>
  <div class="grid" id="mg" style="grid-template-columns:repeat(4,1fr);flex:1;align-content:start;overflow:auto"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn amb" onclick="go('maps')">PLAY OFFLINE VS BOTS</button><button class="btn lime" onclick="openCreate()">CREATE ONLINE ROOM</button></div>
</section>

<section id="maps" class="scr">
  <div class="top"><button class="btn" onclick="go('home')">← BACK</button><h2 id="mt">SELECT ARENA</h2><span></span></div>
  <div class="grid" id="mpg" style="grid-template-columns:repeat(5,1fr);flex:1;align-content:center"></div>
  <div class="row" style="justify-content:space-between"><button class="btn amb" onclick="startOffline()">PRACTICE VS BOTS</button><button class="btn lime" onclick="openCreate()">CREATE ROOM</button></div>
</section>

<section id="loadout" class="scr">
  <div class="top"><button class="btn" onclick="go('home')">← BACK</button><h2>ARMORY &amp; LOADOUT</h2><span></span></div>
  <div class="row" style="flex:1;align-items:stretch;min-height:0">
    <div class="panel" style="flex:1.3;display:flex;flex-direction:column"><b>SELECT CHARACTER</b><div class="grid" id="cg" style="grid-template-columns:repeat(5,1fr);margin-top:8px;flex:1;align-content:start;overflow:auto"></div></div>
    <div class="panel" style="flex:.8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><img id="lImg" style="max-height:55%;max-width:100%"><b id="lName" style="margin-top:6px"></b><span class="mu" id="lAb"></span></div>
    <div class="panel" style="flex:1;display:flex;flex-direction:column"><b>SELECT WEAPON</b><div class="grid" id="wg" style="grid-template-columns:repeat(3,1fr);margin-top:8px;flex:1;align-content:start"></div></div>
  </div>
</section>

<section id="join" class="scr">
  <div class="top"><button class="btn" onclick="go('home')">← BACK</button><h2>JOIN A ROOM</h2><span></span></div>
  <div class="panel" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <span class="mu">Ask your friend for the 4-letter room code</span>
    <input id="jcode" placeholder="CODE" maxlength="4">
    <button class="btn lime big" onclick="openJoin()">JOIN ROOM</button>
  </div>
</section>

<section id="room" class="scr">
  <div class="top"><button class="btn" onclick="go('modes')">← BACK</button><h2>ROOM</h2><span class="mu" id="pc">PLAYERS 1/6</span></div>
  <div class="row" style="flex:1;align-items:stretch;min-height:0">
    <div class="panel" style="flex:1.2;display:flex;flex-direction:column;gap:8px" id="slots"></div>
    <div class="panel" style="flex:.8;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px"><span>ROOM CODE</span><span class="code" id="rcode">----</span><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('Join my Doodle Outpost room: '+NET.code)">COPY INVITE</button><button class="btn" id="micBtn">MIC: OFF</button></div>
  </div>
  <div class="row" style="justify-content:space-between"><button class="btn red" onclick="go('home')">LEAVE ROOM</button><button class="btn lime" id="startBtn" onclick="startOnlineMatch()">START MATCH</button></div>
</section>

<section id="game" class="scr"><canvas id="c" width="960" height="540"></canvas><button class="btn" id="mic" style="position:fixed;top:10px;left:50%;transform:translateX(-50%);display:none">MIC: OFF</button></section>

<section id="res" class="scr">
  <div class="top"><span></span><h2 id="rh">RESULT</h2><span></span></div>
  <div class="row" style="justify-content:center;gap:14px">
    <div class="panel" style="text-align:center;min-width:160px">KILLS<b id="rk" style="display:block;font-size:30px">0</b></div>
    <div class="panel" style="text-align:center;min-width:160px">DEATHS<b id="rd" style="display:block;font-size:30px">0</b></div>
  </div>
  <div class="mu" id="xp"></div>
  <div class="panel" style="flex:1;overflow:auto" id="lb"></div>
  <div class="row" style="justify-content:space-between"><button class="btn lime" onclick="startOffline()">REMATCH</button><button class="btn" onclick="go('home')">LOBBY</button></div>
</section>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/net.js"></script>
<script src="js/tasks.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
